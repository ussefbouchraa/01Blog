
# application.properties
#         ↓
# PostgreSQL connection information
#         ↓
# Spring Boot
#         ↓
# JPA/Hibernate

# -------

# spring.datasource.url
# spring.datasource.username
# spring.datasource.password

# spring.jpa.hibernate.ddl-auto
# spring.jpa.show-sql


spring:
  application:
    name: app

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://localhost:5432/01blog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

jwt:
  secret: SuperSecretKeyFor01BlogPlatformThatIsVeryLong!!
